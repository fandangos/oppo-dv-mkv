name: Issue
description: Something that doesn't work (bugs, crashes, files that don't play, things that broke after installing).
body:
  - type: markdown
    attributes:
      value: |
        > [!WARNING]
        > **Issues are for issues. Feature requests will be removed.**
  - type: dropdown
    id: feature-request
    attributes:
      label: Is this a feature request?
      options:
        - "Yes"
        - "No"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: The version you have installed, what you did, what you expected and what happened.
    validations:
      required: true
